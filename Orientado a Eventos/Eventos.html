<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas - Paradigma Orientado a Eventos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .input-section {
            padding: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        #taskInput:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
        }

        #addBtn {
            padding: 14px 30px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #addBtn:hover {
            background: #34495e;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }

        #addBtn:active {
            transform: translateY(0);
        }

        .filters {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .filter-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            border-color: #2c3e50;
            color: #2c3e50;
        }

        .filter-btn.active {
            background: #2c3e50;
            color: white;
            border-color: #2c3e50;
        }

        .tasks-section {
            padding: 30px;
            max-height: 400px;
            overflow-y: auto;
        }

        .tasks-section::-webkit-scrollbar {
            width: 8px;
        }

        .tasks-section::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .tasks-section::-webkit-scrollbar-thumb {
            background: #7f8c8d;
            border-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9e9e9e;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .empty-state small {
            font-size: 13px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #9e9e9e;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #7f8c8d;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }

        .checkbox.checked {
            background: #7f8c8d;
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .task-text {
            flex: 1;
            font-size: 15px;
            color: #333;
            word-break: break-word;
        }

        .delete-btn {
            padding: 8px 16px;
            background: #95a5a6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .delete-btn:hover {
            background: #7f8c8d;
            transform: scale(1.05);
        }

        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }

        .stats span {
            font-weight: 600;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gestor de Tareas</h1>
            <p>Paradigma Orientado a Eventos</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Escribe una nueva tarea..."
                    autocomplete="off"
                >
                <button id="addBtn">Agregar</button>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Pendientes</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>

        <div class="tasks-section" id="tasksList">
            <div class="empty-state">
                <p>No hay tareas</p>
                <small>Agrega una nueva tarea para comenzar</small>
            </div>
        </div>

        <div class="stats">
            <div>Total: <span id="totalTasks">0</span></div>
            <div>Pendientes: <span id="activeTasks">0</span></div>
            <div>Completadas: <span id="completedTasks">0</span></div>
        </div>
    </div>

    <script>
        // PARADIGMA ORIENTADO A EVENTOS
        // El flujo del programa se controla mediante eventos del usuario
        // Cada interacción dispara un evento que ejecuta una función específica

        let tareas = [];
        let contadorId = 1;
        let filtroActual = 'all';

        // Referencias a elementos DOM
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');
        const tasksList = document.getElementById('tasksList');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalTasks = document.getElementById('totalTasks');
        const activeTasks = document.getElementById('activeTasks');
        const completedTasks = document.getElementById('completedTasks');

        // EVENTO: Agregar tarea al hacer clic en el botón
        addBtn.addEventListener('click', agregarTarea);

        // EVENTO: Agregar tarea al presionar Enter
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                agregarTarea();
            }
        });

        // EVENTO: Cambiar filtro
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filtroActual = e.target.dataset.filter;
                renderizarTareas();
            });
        });

        function agregarTarea() {
            const texto = taskInput.value.trim();
            
            if (texto === '') {
                taskInput.focus();
                return;
            }

            const nuevaTarea = {
                id: contadorId++,
                texto: texto,
                completada: false
            };

            tareas.push(nuevaTarea);
            taskInput.value = '';
            taskInput.focus();
            
            renderizarTareas();
            actualizarEstadisticas();
        }

        function eliminarTarea(id) {
            tareas = tareas.filter(t => t.id !== id);
            renderizarTareas();
            actualizarEstadisticas();
        }

        function toggleCompletada(id) {
            const tarea = tareas.find(t => t.id === id);
            if (tarea) {
                tarea.completada = !tarea.completada;
                renderizarTareas();
                actualizarEstadisticas();
            }
        }

        function renderizarTareas() {
            let tareasFiltradas = tareas;

            if (filtroActual === 'active') {
                tareasFiltradas = tareas.filter(t => !t.completada);
            } else if (filtroActual === 'completed') {
                tareasFiltradas = tareas.filter(t => t.completada);
            }

            if (tareasFiltradas.length === 0) {
                tasksList.innerHTML = `
                    <div class="empty-state">
                        <p>No hay tareas</p>
                        <small>${filtroActual === 'all' ? 'Agrega una nueva tarea para comenzar' : 
                               filtroActual === 'active' ? 'No hay tareas pendientes' : 
                               'No hay tareas completadas'}</small>
                    </div>
                `;
                return;
            }

            tasksList.innerHTML = tareasFiltradas.map(tarea => `
                <div class="task-item ${tarea.completada ? 'completed' : ''}" data-id="${tarea.id}">
                    <div class="checkbox ${tarea.completada ? 'checked' : ''}" onclick="toggleCompletada(${tarea.id})"></div>
                    <div class="task-text">${tarea.texto}</div>
                    <button class="delete-btn" onclick="eliminarTarea(${tarea.id})">Eliminar</button>
                </div>
            `).join('');
        }

        function actualizarEstadisticas() {
            totalTasks.textContent = tareas.length;
            activeTasks.textContent = tareas.filter(t => !t.completada).length;
            completedTasks.textContent = tareas.filter(t => t.completada).length;
        }

        // Inicializar
        actualizarEstadisticas();
    </script>
</body>
</html>
